<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
    <title>2026最新免费VPN - 永久公益节点池</title>
    <meta name="description" content="提供最新免费稳定的 Clash、小火箭订阅节点，持续更新。">
    
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        /* 亮色主题（默认） CSS 变量 */
        :root {
            --primary-color: #007bff;
            --telegram-color: #0088cc;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #6c757d;
            --item-bg: #f8f9fa;
            --item-hover: #f1f3f5;
            --code-bg: #e9ecef;
            --border-color: #e9ecef;
            --modal-bg: rgba(0,0,0,0.6);
        }

        /* 暗黑模式自动适配 */
        @media (prefers-color-scheme: dark) {
            :root {
                --primary-color: #3b82f6;
                --bg-color: #121212;
                --card-bg: #1e1e1e;
                --text-main: #e5e5e5;
                --text-muted: #a3a3a3;
                --item-bg: #2a2a2a;
                --item-hover: #333333;
                --code-bg: #222222;
                --border-color: #3f3f3f;
                --modal-bg: rgba(0,0,0,0.8);
            }
            .btn-import { background: #1e3a8a !important; color: #93c5fd !important; border-color: #1e3a8a !important; }
            .btn-import:hover { background: #1d4ed8 !important; }
            .btn-qr { background: #374151 !important; color: #e5e5e5 !important; }
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg-color); 
            color: var(--text-main);
            margin: 0; 
            padding: 20px 15px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            box-sizing: border-box;
            transition: background-color 0.3s ease;
        }

        .header { text-align: center; margin: 20px 0 30px 0; }
        .header .logo-icon { font-size: 45px; color: var(--primary-color); animation: pulse 2s infinite; }
        .header h1 { font-size: 26px; margin: 12px 0 6px 0; font-weight: 700; }
        .header p { color: var(--text-muted); margin: 0; font-size: 14px; }

        .card { 
            width: 100%; max-width: 480px; 
            background: var(--card-bg); 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
            margin-bottom: 20px; padding: 24px; 
            border-left: 5px solid var(--primary-color); 
            box-sizing: border-box; transition: transform 0.3s ease, background-color 0.3s ease;
        }
        .card:hover { transform: translateY(-2px); }

        .section-title { font-weight: 700; font-size: 16px; margin-bottom: 18px; display: flex; align-items: center; }
        .section-title i { margin-right: 8px; color: var(--primary-color); font-size: 18px; }

        .sub-item { 
            background: var(--item-bg); border-radius: 12px; padding: 16px; 
            margin-bottom: 14px; border: 1px solid var(--border-color); transition: all 0.2s; 
        }
        .sub-item:last-child { margin-bottom: 0; }
        .sub-item:hover { background: var(--item-hover); }
        
        .sub-name { font-size: 14px; font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
        .sub-url { 
            font-family: monospace; font-size: 12px; color: var(--text-muted); 
            word-break: break-all; background: var(--code-bg); 
            padding: 10px; border-radius: 6px; margin-bottom: 12px; user-select: all; 
        }
        
        .btn-group { display: flex; gap: 8px; }
        .btn { 
            flex: 1; padding: 10px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; 
            cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            text-decoration: none; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        
        .btn-copy { background: #343a40; color: white; }
        .btn-copy:hover { background: #212529; }
        
        .btn-import { background: #e7f5ff; color: #0366d6; border: 1px solid #d0ebff; }
        .btn-import:hover { background: #d0ebff; }

        /* 新增：二维码按钮样式 */
        .btn-qr { background: #e2e8f0; color: #475569; flex: 0 0 45px; }
        .btn-qr:hover { background: #cbd5e1; }

        .btn-tg { background: var(--telegram-color); color: white; width: 100%; box-sizing: border-box; font-size: 15px; padding: 12px; border-radius: 10px; }
        .btn-tg:hover { background: #0077b3; box-shadow: 0 4px 12px rgba(0,136,204,0.3); }
        .btn:active { transform: scale(0.95); }

        .footer { font-size: 12px; color: var(--text-muted); margin-top: 20px; text-align: center; line-height: 1.8; max-width: 400px; padding-bottom: 20px; }
        
        /* 弹窗及二维码样式 */
        .modal {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%;
            background-color: var(--modal-bg); backdrop-filter: blur(5px);
            align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s;
        }
        .modal.show { display: flex; opacity: 1; }
        .modal-content {
            background-color: var(--card-bg); padding: 25px; border-radius: 16px; text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2); max-width: 300px; width: 80%; transform: translateY(20px); transition: transform 0.3s;
            position: relative;
        }
        .modal.show .modal-content { transform: translateY(0); }
        .close-btn {
            position: absolute; top: 12px; right: 15px; color: var(--text-muted); 
            font-size: 24px; font-weight: bold; cursor: pointer; line-height: 1;
        }
        .close-btn:hover { color: var(--text-main); }
        #qr-image { width: 200px; height: 200px; margin: 15px auto; display: block; border-radius: 8px; background: white; padding: 10px; }

        .toast {
            position: fixed; bottom: -50px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85); color: white; padding: 10px 24px;
            border-radius: 30px; font-size: 14px; z-index: 9999; transition: all 0.3s ease;
            opacity: 0; pointer-events: none; display: flex; align-items: center; gap: 8px;
        }
        .toast.show { bottom: 40px; opacity: 1; }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.08); opacity: 0.9; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="header">
        <i class="fas fa-bolt logo-icon"></i>
        <h1>永久免费节点池</h1>
        <p>更新及时，更多订阅请加入频道</p>
    </div>

    <div class="card">
        <div class="section-title"><i class="fas fa-link"></i> 公益订阅地址</div>
        
        <div class="sub-item">
            <div class="sub-name"><span>🎁 Clash-Meta ①</span> <small style="color:#0366d6; font-weight:normal;">推荐</small></div>
            <div class="sub-url" id="sub1">https://cai.zmxoo.xyz/config.yaml</div>
            <div class="btn-group">
                <button class="btn btn-copy" onclick="copyText('sub1')"><i class="fas fa-copy"></i></button>
                <a href="clash://install-config?url=https%3A%2F%2Fcai.zmxoo.xyz%2Fconfig.yaml" class="btn btn-import"><i class="fas fa-download"></i> 一键导入</a>
                <button class="btn btn-qr" onclick="showQR('https://cai.zmxoo.xyz/config.yaml', 'Clash 订阅')"><i class="fas fa-qrcode"></i></button>
            </div>
        </div>

        <div class="sub-item">
            <div class="sub-name"><span>🎁 小火箭 ②</span></div>
            <div class="sub-url" id="sub2">https://cai.zmxoo.xyz/index.html</div>
            <div class="btn-group">
                <button class="btn btn-copy" onclick="copyText('sub2')"><i class="fas fa-copy"></i></button>
                <a href="shadowrocket://add/sub://https://cai.zmxoo.xyz/index.html" class="btn btn-import"><i class="fas fa-paper-plane"></i> 一键导入</a>
                <button class="btn btn-qr" onclick="showQR('https://cai.zmxoo.xyz/index.html', '小火箭订阅')"><i class="fas fa-qrcode"></i></button>
            </div>
        </div>
    </div>

    <div class="card" style="border-left-color: var(--telegram-color);">
        <div class="section-title"><i class="fab fa-telegram"></i> Telegram 频道</div>
        <a href="https://t.me/zmxooo" target="_blank" class="btn btn-tg"><i class="fab fa-telegram-plane"></i> 点击加入频道交流</a>
    </div>

    <div class="footer">
        <i class="fas fa-shield-alt" style="color: #10b981;"></i> 采用高强度加密，保护隐私安全<br>
        <span style="display:inline-block; margin-top:5px;">© 2026 zmxoo.xyz 版权所有</span>
    </div>

    <div id="toast" class="toast"><i class="fas fa-check-circle" style="color: #2ed573;"></i> <span id="toast-text"></span></div>

    <div id="qrModal" class="modal" onclick="closeQR(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close-btn" onclick="closeQR(event)">&times;</span>
            <h3 id="qr-title" style="margin-top: 0; font-size: 16px;">扫描二维码导入</h3>
            <img id="qr-image" src="" alt="二维码加载中...">
            <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 0;">请使用客户端右上角的扫码功能</p>
        </div>
    </div>

    <script>
        // 复制功能
        function copyText(elementId) {
            const text = document.getElementById(elementId).innerText;
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => showToast('📋 复制成功！')).catch(() => fallBackCopy(text));
            } else {
                fallBackCopy(text);
            }
        }

        function fallBackCopy(text) {
            const input = document.createElement('textarea');
            input.value = text;
            input.style.position = 'fixed';
            document.body.appendChild(input);
            input.select();
            try { document.execCommand('copy'); showToast('📋 复制成功！'); } 
            catch (err) { showToast('❌ 复制失败，请手动复制'); }
            document.body.removeChild(input);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-text').innerText = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // 二维码功能
        function showQR(url, title) {
            document.getElementById('qr-title').innerText = '扫描 ' + title;
            // 使用 api.qrserver.com 生成二维码
            document.getElementById('qr-image').src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=10&data=' + encodeURIComponent(url);
            document.getElementById('qrModal').classList.add('show');
        }

        function closeQR(event) {
            if(event) event.preventDefault();
            document.getElementById('qrModal').classList.remove('show');
            // 延迟清空图片 src，防止闪烁
            setTimeout(() => { document.getElementById('qr-image').src = ''; }, 300);
        }
    </script>
</body>
</html>
