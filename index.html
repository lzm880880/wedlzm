<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>同城红娘 - 婚恋交友平台</title>

<style>
body{margin:0;font-family:Arial;background:#f6f6f6}

/* 顶部 */
.top{
  background:#d81e06;
  color:#fff;
  padding:12px;
  display:flex;
  justify-content:space-between;
}

/* banner */
.banner{
  background:linear-gradient(135deg,#ff4d4f,#d81e06);
  color:#fff;
  text-align:center;
  padding:35px 15px;
}

.banner h1{margin:0;font-size:22px}
.banner p{opacity:0.9}
.btn{
  display:inline-block;
  margin-top:10px;
  background:#fff;
  color:#d81e06;
  padding:8px 15px;
  border-radius:5px;
}

/* stats */
.stats{
  display:flex;
  background:#fff;
  padding:10px;
  justify-content:space-around;
  font-size:12px;
}
.stats b{color:#d81e06}

/* section */
.section{padding:10px}
.title{font-weight:bold;margin:10px 0}

/* cards */
.list{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.card{
  width:48%;
  background:#fff;
  border-radius:8px;
  padding:10px;
  text-align:center;
}

.card img{
  width:70px;height:70px;border-radius:50%;
}

.card button{
  background:#d81e06;
  color:#fff;
  border:none;
  width:100%;
  padding:6px;
  margin-top:6px;
  border-radius:5px;
}

/* vip */
.vip{
  background:#fff3f3;
  margin:10px;
  padding:15px;
  text-align:center;
  border-radius:10px;
}

/* login modal */
.modal{
  display:none;
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.5);
}

.box{
  width:280px;
  background:#fff;
  margin:120px auto;
  padding:15px;
  border-radius:8px;
}

input{
  width:100%;
  margin:5px 0;
  padding:8px;
}

button{
  background:#d81e06;
  color:#fff;
  border:none;
  width:100%;
  padding:8px;
}
</style>
</head>

<body>

<div class="top">
  <div>同城红娘</div>
  <div onclick="openLogin()">登录/注册</div>
</div>

<div class="banner">
  <h1>真实交友 · 同城相亲</h1>
  <p>红娘1对1匹配 · 高成功率脱单</p>
  <div class="btn" onclick="openLogin()">立即注册</div>
</div>

<div class="stats">
  <div><b>120K</b><br>会员</div>
  <div><b>35K</b><br>成功</div>
  <div><b>100%</b><br>真人</div>
</div>

<div class="section">
  <div class="title">推荐会员</div>

  <div class="list">

    <div class="card">
      <img src="https://i.pravatar.cc/100?img=12">
      <div>小雨 23</div>
      <div>上海</div>
      <button onclick="openLogin()">查看联系方式</button>
    </div>

    <div class="card">
      <img src="https://i.pravatar.cc/100?img=32">
      <div>Anna 26</div>
      <div>新加坡</div>
      <button onclick="openLogin()">查看联系方式</button>
    </div>

    <div class="card">
      <img src="https://i.pravatar.cc/100?img=22">
      <div>Leo 28</div>
      <div>深圳</div>
      <button onclick="openLogin()">查看联系方式</button>
    </div>

    <div class="card">
      <img src="https://i.pravatar.cc/100?img=45">
      <div>Mike 30</div>
      <div>北京</div>
      <button onclick="openLogin()">查看联系方式</button>
    </div>

  </div>
</div>

<div class="vip">
  <h3>VIP解锁联系方式</h3>
  <p>红娘推荐 + 优先匹配</p>
  <button onclick="openLogin()">开通VIP</button>
</div>

<!-- 登录弹窗 -->
<div class="modal" id="m">
  <div class="box">
    <h3>登录/注册</h3>
    <input placeholder="邮箱">
    <input type="password" placeholder="密码">
    <button onclick="login()">进入</button>
  </div>
</div>

<script>
function openLogin(){
  document.getElementById("m").style.display="block";
}

function login(){
  alert("模拟登录成功");
  document.getElementById("m").style.display="none";
}
</script>

</body>
</html>
